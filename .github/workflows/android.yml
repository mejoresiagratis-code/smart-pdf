name: Android CI

# Sin `run-name` a propósito.
#
# Antes se fijaba a `github.event.head_commit.message`, que es el mensaje ENTERO —título y
# cuerpo—, así que el título del run salía como un muro de texto cortado. Las expresiones de
# Actions no tienen función para partir cadenas, así que no se puede recortar a la primera
# línea desde aquí.
#
# Sin `run-name`, GitHub usa su valor por defecto, que para un `push` es exactamente **la
# primera línea del commit**. Como los títulos de commit siguen ahora el formato
# `rellenador-<versionName>`, el título del run coincide con el nombre del artefacto y con el
# del APK de dentro.
#
# En `workflow_dispatch` no hay commit y el título vuelve a ser "Android CI #N"; para saber qué
# se compiló está el paso «Resumen del build», que imprime versión y versionCode.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instala un SDK de Android limpio y correcto en el runner.
      # Esto es justo lo que falta en el Codespace (ANDROID_HOME vacio).
      #
      # `cmdline-tools-version` fijado a la que YA trae preinstalada el runner. Sin esto la
      # acción la considera "wrong version", se baja otra copia de dl.google.com y ese paso
      # solo se lleva ~3 min de los ~5 del build entero.
      #
      # OJO: es un número acoplado a la imagen del runner de GitHub. Si algún día actualizan
      # la preinstalada, este paso se pondrá a descargar otra vez (vuelve a tardar, no
      # rompe) o fallará si la versión fijada desaparece. Si eso pasa, mirar qué versión
      # reporta el log en "Found preinstalled sdkmanager" y actualizar aquí, o quitar la
      # línea para volver al comportamiento automático.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Leer version del proyecto
        id: ver
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Compilando $NAME (code $CODE)"

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      # Gradle siempre lo llama `app-debug.apk`. Al descargar varios a la vez, todos se
      # llaman igual y hay que abrirlos para saber cuál es cuál. Se renombra al mismo
      # nombre que el artefacto, así el zip y el APK de dentro coinciden.
      - name: Renombrar el APK con la version
        run: |
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          mv "$SRC" "app/build/outputs/apk/debug/rellenador-${{ steps.ver.outputs.name }}.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          # Mismo nombre que el APK de dentro: zip, APK y título del commit coinciden.
          name: rellenador-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Resumen del build
        if: always()
        run: |
          {
            echo "## Rellenador de Contratos"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Versión | \`${{ steps.ver.outputs.name }}\` |"
            echo "| versionCode | ${{ steps.ver.outputs.code }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Lanzado por | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
