name: Android CI

# Título visible en la lista de Actions.
# En `push`, GitHub ya usaba el mensaje del commit; en `workflow_dispatch` no hay commit
# en el evento y se quedaba en "Android CI #NNN", sin decir qué se estaba compilando.
# El operador `||` de las expresiones actúa como "si es nulo, usa esto otro".
run-name: >-
  ${{ github.event.head_commit.message || format('Compilación manual · {0}', github.sha) }}

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instala un SDK de Android limpio y correcto en el runner.
      # Esto es justo lo que falta en el Codespace (ANDROID_HOME vacio).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Leer version del proyecto
        id: ver
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Compilando $NAME (code $CODE)"

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          # Con la versión en el nombre no hay que abrir el APK para saber cuál es
          # cuando hay varios descargados a la vez.
          name: rellenador-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Resumen del build
        if: always()
        run: |
          {
            echo "## Rellenador de Contratos"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Versión | \`${{ steps.ver.outputs.name }}\` |"
            echo "| versionCode | ${{ steps.ver.outputs.code }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Lanzado por | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
